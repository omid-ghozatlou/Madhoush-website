<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>مدیریت محتوا - مدهوش</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
      /* RTL support for CMS editor */
      [data-slate-editor] {
        direction: rtl !important;
        text-align: right !important;
        font-family: 'Vazir', 'Tahoma', 'Arial', sans-serif !important;
        line-height: 2 !important;
      }
      /* RTL for preview pane */
      .frame-content {
        direction: rtl !important;
        text-align: right !important;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Register RTL preview style for article pages
      CMS.registerPreviewStyle(
        'https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css',
      );
      CMS.registerPreviewStyle(`
        html, body {
          direction: rtl;
          text-align: right;
          font-family: 'Vazir', 'Tahoma', 'Arial', sans-serif;
          line-height: 2;
          background: #1a0f0f;
          color: #b0b0b0;
          padding: 2rem;
          font-size: 1.15rem;
          max-width: 800px;
          margin: 0 auto;
        }
        h1, h2 { color: #00d9ff; }
        h3 { color: #ff006e; }
        a { color: #00d9ff; }
        a:hover { color: #ff006e; }
        blockquote {
          border-right: 4px solid #00d9ff;
          padding: 1rem 1.5rem;
          margin: 1rem 0;
          background: rgba(0, 217, 255, 0.05);
          border-radius: 0 8px 8px 0;
          font-style: italic;
          color: #ffffff;
        }
        img {
          max-width: 100%;
          border-radius: 8px;
          border: 2px solid rgba(0, 217, 255, 0.2);
          margin: 1.5rem 0;
        }
        ul, ol {
          padding-right: 2rem;
          margin-bottom: 1.5rem;
        }
        li { margin-bottom: 0.5rem; }
        code {
          background: rgba(255, 255, 255, 0.1);
          padding: 0.2rem 0.5rem;
          border-radius: 4px;
          font-size: 0.95em;
        }
        pre {
          background: rgba(0, 0, 0, 0.4);
          padding: 1.5rem;
          border-radius: 8px;
          overflow-x: auto;
          margin: 1.5rem 0;
          border: 1px solid rgba(255, 255, 255, 0.1);
        }
        pre code { background: none; padding: 0; }
        strong { color: #ffffff; }
        p { margin-bottom: 1.5rem; }
      `, {raw: true});
    </script>
  </body>
</html>
